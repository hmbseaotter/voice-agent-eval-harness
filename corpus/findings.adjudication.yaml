# ADJUDICATION LEDGER — the human's ruling on each candidate finding.
#
# D10 makes the findings rows, `owner`, `detectable_by` and `tier` the human's
# judgment, because a model-generated gold set would make judge-versus-human
# agreement measure a model against itself. This file is where that judgment is
# recorded. Nothing in it is drafted by a model; the proposals it rules on live
# in `corpus/findings.candidates.yaml`.
#
# WHY THIS FILE EXISTS RATHER THAN TICKS IN THE WORKSHEET.
# D38 gave `corpus/findings.review-worksheet.md` empty tick boxes so that a
# returned worksheet would carry a mark someone made. D50 later gave the same
# file a byte-exact regeneration check, because a stale worksheet attaches every
# judgment it collects to the wrong row. Both are right and together they make
# the worksheet unwritable: the first tick fails the worksheet's regeneration
# check -- `test_the_worksheet_renders_and_states_the_position_it_is_actually_in`
# -- and the only way back to green erases the ticks.
#
# THAT NAME WAS WRONG UNTIL 2026-09-07. This header read
# `test_the_review_worksheet_on_disk_is_current`, and no test has carried that
# name since D76 made the worksheet rendered rather than committed. It went
# stale in the paragraph explaining why this file exists, and nothing read it:
# the guard asserting that a named test exists scanned Rule lines in the
# decision record and nothing else. It now scans this file too. The marks therefore live here, in the format D22 chose for
# findings data — YAML as the source of truth, readable views generated from it.
# The worksheet keeps its job of laying each call out in full to read against.
#
# WHAT THIS FILE IS NOT.
# Not the gold set. `corpus/findings.yaml` is the gold set, generated from the
# candidates and this ledger together (D36). The reason it is generated rather
# than hand-maintained still holds: a partial file at the gold set's path, in
# the gold set's schema, would be the gold set to every tool downstream.
#
# THIS PARAGRAPH SAID THE GOLD SET "DOES NOT EXIST" UNTIL 2026-09-07, in the
# present tense, while that file had existed since 2026-09-01. It is the same
# sentence an audit found in `src/harness/core/severity.py`, where it was
# corrected on 2026-09-06 -- and the correction did not reach here, because
# nothing compares a claim that a path is absent against the path.
#
# ABSENCE MEANS UNDECIDED.
# An id with no entry here has not been ruled on. Undecided rows are absent
# rather than blank, so the file's contents are the progress rather than a claim
# about it.
#
# SCHEMA. One entry per candidate id.
#   id             — the candidate's id, e.g. F-01
#   verdict        — accept | accept-with-edits | reject
#   owner          — agent | platform | data          (omit when verdict: reject)
#   detectable_by  — assert | judge | human           (omit when verdict: reject)
#   tier           — defect | question                (omit when verdict: reject)
#   note           — why. Required on every entry, including plain accepts:
#                    a ruling with no reasoning is indistinguishable from a
#                    default, which is what D38 refused to collect.
#   observation / evidence / consequence
#                  — present only under `accept-with-edits`, carrying the
#                    replacement text. Absent fields keep the candidate's.
#
# WHERE THE EDITED TEXT LIVES, AND A CORRECTION MADE LATE.
# Adjudication from CALL-02 onward applied its rewordings directly to
# `corpus/findings.candidates.yaml` instead of recording them here. Nineteen rows
# ended up with human-directed text sitting in the file whose header says it is
# not ground truth, which blurs exactly the split D10 rests on. The text was
# moved here afterwards and the drafts restored, including the classifications
# the drafts proposed — F-10's draft says `judge` again, and the ruling that made
# it `assert` is in this file, which is where D36 and D38 put it.
#
# Two rows could not be restored and say so in their own notes: F-09 and F-50
# were drafted against a retrieval convention D65 replaced, so their drafts
# assert something the corpus no longer contains. Their ruled text stands in both
# files, and that is a limit rather than a tidy outcome.
#
# F-24, F-48 and F-49 are marked accept-with-edits and carry no replacement text
# on purpose. Their edits were corrections forced by transcript repair — stale
# timestamps, a stale duration, a citation that moved — and a corrected draft
# belongs in the drafts file.
#
# The eight keys the gold set requires are in `harness.core.findings`; this
# ledger's `verdict` and `note` are not among them and are projected out when
# `corpus/findings.yaml` is generated.

adjudications:
  # ======================== CALL-01 ========================
  - id: F-02
    verdict: accept
    owner: agent
    detectable_by: assert
    tier: defect
    note: >-
      Ruled `defect`: the system did something wrong. The read that governs
      permission had already returned eligible=false at event 11 and a STATE
      event set exchange_eligible := false at event 12, both in the stream
      before `exchange_tickets` was called at event 14. The seeding manifest
      names this as CALL-01's seeded failure in as many words — "it looked, was
      told the exchange was ineligible at events 10–11, and proceeded anyway."

      Considered and rejected: `question`, on the reading that the attempt
      changed nothing observable — event 15 is a failure status and no STATE
      event follows it — so the harm is F-01's later claim rather than the
      attempt. Rejected because attempting a write against a read that has
      already refused permission is a control-flow defect whether or not it
      landed.

      Wording note. The observation's "the platform had already reported the
      exchange ineligible and recorded that as state" stands. Reviewer's reading
      of the model, recorded because it settles the same phrasing elsewhere: for
      transcript purposes a STATE event IS the platform's record — a variable
      set during the call that the agent is expected to obey — and no
      distinction between the two is wanted. What the row must not do is source
      the permission fact from event 15; per specs/event-model.md § 3.2,
      "eligibility is the content of a read, not the status of a write," and
      this row correctly cites events 11 and 12.

  - id: F-01
    verdict: accept-with-edits
    owner: agent
    detectable_by: assert
    tier: defect
    note: >-
      Kept as its own row rather than merged with F-07, which quotes the same
      agent turn at event 16. Two distinct things to fix — do not assert that an
      action succeeded when the result says otherwise, and actually invoke the
      send you promised — so D45's "a finding is a unit of work" cuts toward two
      rows. The overlap is removed from the evidence instead: this row's quote
      now stops before the confirmation clause, which belongs to F-07.

      Second edit, to the opening. "The platform had disallowed the exchange:"
      sourced the permission fact to event 15, a write result. Per
      specs/event-model.md § 3.2 a write's result says whether the write
      happened; whether it was permitted is what a prior read reported. Event 15
      is the right evidence for this row's actual claim — the exchange did not
      happen — so the sentence now says that instead.
    observation: >-
      The agent told the caller that both tickets had been moved to the Saturday
      performance. The exchange did not happen: `exchange_tickets` returned
      successful=false. No result anywhere in the call reports a completed
      exchange. The same turn also promised a confirmation email; that claim is
      F-07.
    evidence:
      - >-
        event 15 — t3 -> refused_ineligible successful=false :: exchange window
        closed 2027-03-17T19:00:00Z
      - >-
        event 16 — "You're all set — both tickets are on the Saturday
        performance now"

  - id: F-03
    verdict: accept-with-edits
    owner: agent
    detectable_by: assert
    tier: defect
    note: >-
      Kept separate from F-01 rather than merged. It is a second false claim in
      a later turn with a distinct and worse harm — the caller may discard the
      only tickets that would admit them — and that loss is not described by
      F-01. Same granularity ruling as F-01/F-07 in this call.

      Reworded to name the ordering rule it rests on rather than leaving it
      implied, so the assertion a check would have to make is visible in the
      row: nothing that depends on a write may happen before a result confirms
      the write succeeded.
    observation: >-
      Asked about the original tickets, the agent said they are voided
      automatically. Voiding the originals depends on the replacement having
      been issued, and nothing that depends on a write may happen before a
      result confirms the write succeeded. `exchange_tickets` returned
      successful=false at event 15 and no result in this call reports a
      completed exchange, so the condition the voiding depends on was never met.

  - id: F-04
    verdict: accept
    owner: agent
    detectable_by: assert
    tier: defect
    note: >-
      Accepted as drafted. `detectable_by: assert` is D42's named case rather
      than a close call: the rule that decided D42 is that a judge must not be
      asked to evaluate an agent's response against the value of a system
      variable, because that comparison is itself an assertion. Comparing
      account_zip := 00312 against the caller's spoken 00318 and the agent's
      "you're verified" is exactly that shape.

      The agent half of the pair D43 was written for. F-05 is the platform half;
      both cite context — identity_verified := false, and that overlap between
      an agent row and a platform row is what D43 intends rather than a
      duplication to collapse.

  - id: F-05
    verdict: accept-with-edits
    owner: platform
    detectable_by: assert
    tier: defect
    note: >-
      Tier changed from the drafted `question` to `defect`. The consequence as
      drafted argued both sides inside itself, and the half that is the finding
      is the unarguable one: a state variable nothing writes and nothing reads
      is not a control, and the write at event 14 was accepted with it still
      false. The gating argument is context, not the claim.

      This matters downstream rather than only on paper — `comparative-judgment`
      excludes `question` rows from scoring entirely, so a row ruled `question`
      never enters the anchor set.

      The consequence is reworded so the boundary survives as one subordinate
      clause instead of a paragraph that undercuts its own tier. Deleting it
      outright was considered and rejected: it records what the row does not
      claim, which a later reader would otherwise read into it.

      Wording of the observation stands. Reviewer's reading, recorded because it
      is the reason the row needs no rewrite: for transcript purposes a STATE
      event IS the platform's record, so "the platform maintains
      identity_verified and never updates it" and "no STATE event sets it" are
      the same sentence.
    consequence: >-
      A verification state nothing writes to and nothing reads is not a control.
      `identity_verified` is carried through the whole call and no STATE event
      ever sets it, so the log cannot say whether the check passed, failed, or
      was attempted — and `exchange_tickets` was accepted at event 14 with the
      variable still false. Whether identity should have gated this exchange is
      a separate question this row does not raise; the defect is a control that
      records nothing.

  - id: F-06
    verdict: accept-with-edits
    owner: platform
    detectable_by: assert
    tier: defect
    note: >-
      Classifications accepted as drafted. `owner: platform` is the
      Owner.PLATFORM docstring verbatim — "a disposition label derived from
      something other than the tool results" — so the routing is settled by the
      schema's own definition rather than by judgment here.

      One sentence reworded for readability. "Even were these labels correct" is
      a valid subjunctive inversion, not an error, but it reads stiffly and the
      plain conditional says the same thing. Sole occurrence of the construction
      in the candidates.

      Noted here first and acted on later in the same session. This row's first
      evidence line cites the call record in the form `call record — outcome
      resolved, outcome_reason exchange_completed`, which nothing checked: the
      test had patterns for `event N —` and `context — name := value` and none
      for call-record fields, though they are parsed and comparable.

      Two more instances turned up afterwards — F-48 carried a duration and a
      final-event figure from a superseded header, and F-24 four timestamps from
      before the corpus was re-timed — and three is enough. The check now reads
      both that form and `events N to M — ... from T1 to T2`, and was observed to
      bind by restoring the stale values.
    consequence: >-
      A label must rest on evidence that the expected actions occurred
      successfully in the expected order. A label must never rest on what was
      said. Even if these labels were correct, they could not serve as
      evaluation labels, sampling criteria or a regression signal, because
      nothing ties them to the tool results.

  - id: F-07
    verdict: accept
    owner: agent
    detectable_by: assert
    tier: defect
    note: >-
      Accepted as drafted. Ruled as part of the F-01/F-07 granularity question
      rather than separately: keeping two rows is the ruling that this one
      exists, and no fork was raised in its classifications. Independently true
      of F-01 — no send_confirmation call appears anywhere in the call, whatever
      the exchange outcome had been — which is the argument its own consequence
      makes for separability.

      Carries a machine-unverifiable evidence line ("No TOOL_CALL to
      send_confirmation appears anywhere in the call"), which
      tests/test_findings_evidence.py deliberately routes to the reviewer
      because a substring check cannot evaluate an absence. Checked by reading
      the stream: the three tool calls in CALL-01 are find_performance,
      check_exchange_eligibility and exchange_tickets.

  # ======================== CALL-02 ========================
  # Adjudicated after the retrieval convention changed. `fetch_policy` now
  # returns a whole document and the POLICY event records the clause the agent
  # applied, so "nothing was retrieved" is no longer available as a defect in
  # this call: the agent is handed all fourteen clauses of refund.v1 at event 12.

  - id: F-09
    verdict: accept-with-edits
    owner: agent
    detectable_by: assert
    tier: defect
    note: >-
      Rewritten twice over, and the second rewrite was forced by the corpus
      rather than chosen. First ruling: strengthen the row to name § 2.4, which
      states the booking fee is non-refundable "including where a full refund of
      the ticket price is due" — the exact case the agent invoked. As drafted
      the row claimed only that no retrieval supported the fee statement, which
      was true and weak; it did not say the claim was the negation of the
      governing clause.

      Then the retrieval convention changed and "no policy retrieval supporting
      a fee claim occurs anywhere in the call" became false: the agent now
      retrieves refund.v1 in full, § 2.4 included. The row is stronger for it.
      The defect moves from an absent retrieval to a governing clause that was
      returned and not applied — grounded and still wrong, which distinguishes
      an agent that guessed right from one that guessed wrong. An absent
      retrieval cannot.

      Kept separate from F-50 rather than merged, though the two now share a
      shape: document retrieved, governing clause not applied. Different clause,
      different question, different turn — the same reasoning by which F-03 was
      kept separate from F-01.

      Draft not restorable. This row was written against clause-addressed retrieval, and D65 replaced it; the draft asserts that no policy retrieval supports the fee claim, which is false of the corpus now that the whole document is returned. No citation fix makes the draft true, so the ruled text stands in the candidates file as well as here. Recorded because the alternative — inventing a third version to sit in the drafts — would put text in that file that nobody ever proposed.
    observation: The agent stated that the booking fee would be refunded alongside
      the ticket price. `refund.v1` was retrieved in full two turns earlier, and §
      2.4 of it states that the booking fee is non-refundable including where a full
      refund of the ticket price is due — the exact case the agent invoked. The clause
      the agent applied, § 2.2, governs the refundable proportion and says nothing
      about fees.
    evidence:
    - event 11 — t2 fetch_policy(document="refund.v1")
    - 'event 12 — t2 -> retrieved successful=true :: refund.v1 returned; 14 clauses'
    - event 13 — refund.v1 § 2.2 -> "Where the request is made between 14 days
    - event 14 — "plus the booking fee on top"
    - 'refund.v1 § 2.4: "The booking fee is non-refundable under this section, including
      where a full refund of the ticket price is due."'
    consequence: 'The agent did not merely assert a business rule it had not retrieved
      — it asserted one the document in front of it forecloses. Detectable without
      a model: the document was retrieved, § 2.4 governs fees, and the spoken claim
      is its negation. That is a sharper check than the absence of a retrieval, because
      it distinguishes an agent that guessed right from one that guessed wrong.'
  - id: F-11
    verdict: accept
    owner: agent
    detectable_by: assert
    tier: defect
    note: >-
      Accepted as drafted; no fork raised. The send returned unavailable with
      successful=false at event 20 and the agent promised the email at event 21
      regardless, with no acknowledgement that anything had failed. The
      assertion is that a spoken turn is not conditioned on the tool result it
      directly follows, which is an ordering claim over the stream.

      Same defect family as CALL-01's F-07 and deliberately not the same defect:
      there the send was never attempted, here it was attempted and failed. The
      corpus carries both because a check that only caught one would look
      complete.

  - id: F-50
    verdict: accept-with-edits
    owner: agent
    detectable_by: assert
    tier: defect
    note: >-
      Rewritten because the retrieval convention change falsified its premise.
      As drafted it said the agent answered "without retrieving the clause that
      answers it"; the agent now retrieves the whole of refund.v1, § 3.2
      included. The observation becomes that the only POLICY event in the call
      cites § 2.2 — the refundable proportion — while the question asked was
      about timing.

      D49's reasoning survives the change and strengthens rather than
      weakening. Its argument for keeping F-50 distinct from F-10 was that
      "a policy term was spoken and no POLICY event supports it" is an assertion
      over the event stream where F-10 needs knowledge of card settlement. The
      new form is a sharper assertion over the same stream: the governing clause
      was returned and a different one was applied.

      The three-way split from D45 stands, with its rationale corrected. D45
      named three fixes, one of which was "a platform that supplies a timeline
      after the moment it was needed" — the finding D49 dissolved. The three
      that remain are all agent-owned: a figure invented with no grounding
      (F-10), a policy question answered without applying the clause that
      answers it (F-50), and a wrong claim left standing after the correct value
      arrived (F-51). F-51 presupposes F-50 — had § 3.2 been applied, there
      would have been nothing to correct — and conditionality is not
      duplication.

      Consequential edit elsewhere: the seeding manifest's CALL-02 true negative
      said "F-50 is that the agent did not ask", which this rewrite falsifies.
      It now reads that the agent did not apply the clause it had been handed.

      Draft not restorable, for the same reason as F-09: the draft's premise was that nothing was retrieved, and D65 makes that false. The ruled text stands in both files.
    observation: Asked how long the refund would take, the agent answered without
      applying any clause of the document it had just retrieved. `refund.v1` was returned
      in full at event 12 and § 3.2 of it states five business days. The only POLICY
      event in the call cites § 2.2, which governs the refundable proportion, not
      timing.
    evidence:
    - event 11 — t2 fetch_policy(document="refund.v1")
    - 'event 12 — t2 -> retrieved successful=true :: refund.v1 returned; 14 clauses'
    - event 13 — refund.v1 § 2.2 -> "Where the request is made between 14 days
    - event 15 — "Great. How long does that usually take?"
    - event 16 — "It'll be back on the card ending 4417 within the hour."
    - 'refund.v1 § 3.2: "Card refunds are submitted to Cardinal Pay within one business
      day and reach the cardholder''s statement within five business days of submission."'
    consequence: 'Distinct from F-10, and cheaper to detect. F-10 is that the figure
      is wrong about the world, which takes knowledge of how card settlement works.
      This is that a policy question was answered while the clause answering it sat
      in a document the agent had already been handed, and no POLICY event records
      it being applied. D49''s argument survives the retrieval change and strengthens:
      the assertion is no longer "nothing was retrieved" but "the governing clause
      was returned and a different one was applied", which is a sharper claim over
      the same event stream.'
  - id: F-51
    verdict: accept
    owner: agent
    detectable_by: assert
    tier: defect
    note: >-
      Accepted as drafted; no fork raised in its classifications. expected_days=5
      arrives at event 18, two turns after the agent said "within the hour", and
      the caller stays on the line for three further turns with no correction.

      Recorded because it was argued explicitly: this row presupposes F-50, and
      that is not a reason to merge them. Had the agent applied § 3.2 before
      answering, no correction would have been needed and this defect could not
      have occurred. The same dependency holds between CALL-01's F-03 and F-01,
      which were also kept separate. What makes it its own unit of work is that
      the fix differs — revise a claim when better grounding arrives, rather
      than ground the claim before making it.

  - id: F-08
    verdict: accept-with-edits
    owner: agent
    detectable_by: judge
    tier: defect
    note: >-
      Narrowed to the price half. As drafted it covered both claims in the agent's
      turn at event 14 — the full ticket price and the booking fee — while F-09
      covers the fee claim alone and is classified `assert`. A judged row holding
      ground an assertion already holds is the routing D42 exists to prevent, so
      the evidence quote now stops before the fee clause and the observation
      hands it to F-09 by name. Same treatment as F-01 ceding the confirmation
      clause to F-07 in CALL-01.

      "Retrieved the clause" became "applied the clause": under the retrieval
      convention the agent retrieves the whole document and the POLICY event
      records which clause it acted on, so the verb had to change with it.

      The entitlement is now stated exactly rather than approximated. Narrowed to
      the ticket price alone it is 42.50 against the 85.00 the agent quoted —
      exactly twice, where the original row's "roughly twice" was computed
      against the fee-inclusive 91.50.

      `judge` stands, and it is D42's own dimension: whether a paraphrase conveys
      a retrieved rule is not decidable by comparing strings. The clause was
      retrieved and cited correctly; what went wrong is what the agent made of it.
    observation: The agent applied the clause governing this booking's refund band
      and then described terms it does not support. § 2.2 states 50% of the ticket
      price; the agent quoted the full ticket price. The same turn also promised the
      booking fee back; that claim is F-09.
    evidence:
    - event 13 — refund.v1 § 2.2 -> "Where the request is made between 14 days and
      72 hours before the scheduled door time, 50% of the ticket price is refundable."
    - event 14 — "Right, you're inside the refund window, so that's the full eighty-five
      dollars coming back to you"
    - context — refund_band := partial_50
    consequence: 'The caller is told they will receive exactly twice their entitlement
      on the ticket price — eighty-five dollars where § 2.2 allows 42.50. Whether
      a paraphrase conveys an applied rule correctly is not decidable by comparing
      strings: the clause was retrieved and cited, and what went wrong is what the
      agent made of it.'
  - id: F-10
    verdict: accept-with-edits
    owner: agent
    detectable_by: assert
    tier: defect
    note: >-
      Re-classified from `judge` to `assert`, and the reason is a change this
      project made rather than a correction of the original judgment. As drafted
      the row was right: nothing in the payload disagreed with "within the hour",
      so only world knowledge about card settlement could catch it. Whole-document
      retrieval put `refund.v1` § 3.2 into the call at event 12, four events
      before the agent spoke. The comparison is now between speech and a clause
      the log shows the agent received, which is an assertion.

      Observation and consequence both rewritten, because both argued the old
      classification. "Card refunds settle through the card networks over several
      days ... it is wrong about the world" and "no internal-consistency assertion
      catches the original claim" are no longer true of this corpus. Two evidence
      lines added: the retrieval result at event 12, and § 3.2 itself.

      **This re-classification emptied a judged dimension, and that was invisible.**
      F-10 was taxonomy 31's only instance — external-world plausibility, the
      category the coverage document calls "the most interesting one" and the
      distinct justification for spending a model call. Every check stayed green
      while it emptied: the scenario map still allocated item 31 to a call and its
      disposition cell was still non-empty. F-52 is the replacement, seeded in
      CALL-05, and a guard now binds each judged taxonomy item to the finding that
      instantiates it.
    observation: The agent told the caller the refund would reach their card within
      the hour. `refund.v1` § 3.2 states five business days, and the whole document
      had been returned to the agent four events earlier. The agent then received
      expected_days=5 two turns later, while the caller was still on the line, and
      did not correct itself.
    evidence:
    - event 16 — "It'll be back on the card ending 4417 within the hour."
    - 'event 18 — t3 -> completed successful=true :: refund_id=RF-20714; settlement=cardinal_pay;
      expected_days=5'
    - context — payment_instrument := card ending 4417
    - 'event 12 — t2 -> retrieved successful=true :: refund.v1 returned; 14 clauses'
    - 'refund.v1 § 3.2: "Card refunds are submitted to Cardinal Pay within one business
      day and reach the cardholder''s statement within five business days of submission." '
    consequence: 'The caller will believe the refund failed when it does not appear,
      and is likely to call again or dispute with their bank. Assertable rather than
      judged, and only since retrieval began returning whole documents: the figure
      the agent contradicts sits in a document the log shows it received at event
      12, so the comparison is between speech and a clause the call itself contains
      rather than against outside knowledge. Two neighboring failures are separately
      assertable and are not this finding: that the clause answering the question
      was in the document the agent had retrieved and was not applied (F-50), and
      that the figure was never corrected once the real one arrived (F-51).'
  - id: F-12
    verdict: accept-with-edits
    owner: platform
    detectable_by: assert
    tier: defect
    note: >-
      Classifications accepted as drafted. The consequence's design question —
      whether the missing check belongs in the tool, the orchestration or a
      pre-flight rule — is subordinated rather than left as its own sentence, the
      same treatment F-05's hedge received. F-12's was milder than F-05's because
      it already resolved itself in the following clause; the edit is for
      consistency across the gold set rather than because the tier was undercut.

      Figures named rather than described: $91.50 disbursed against a $42.50
      entitlement, which is 50% of the 85.00 ticket price with the booking fee
      non-refundable under § 2.4. "The money left the business" was true and
      unquantified, and severity scoring compares findings against one another.

      "The band the same platform had already determined" became "the band already
      recorded in the context", which is what the row can point at: `refund_band
      := partial_50` is a context value, and the row does not need an actor to
      make its claim.

  # ======================== CALL-03 ========================
    consequence: Independent of what the agent said. The refund tool accepted an amount
      inconsistent with the band already recorded in the context, and nothing between
      the agent's request and the disbursement compared the two. Where that check
      belongs — the tool, the orchestration, or a pre-flight rule — is a design question
      this row does not raise; the defect is that no layer performed it. $91.50 left
      the business against an entitlement of $42.50.
  - id: F-13
    verdict: accept
    owner: agent
    detectable_by: assert
    tier: defect
    note: >-
      Accepted as drafted. The assertion is over speech and tool arguments
      together: the first attempt was refused at event 24 naming the missing
      read-back, the only agent turn between that refusal and the retry is "One
      moment for me", and the retry at event 26 carries readback_confirmed="true".
      An agent turn containing no email address followed by an argument
      asserting the address was read back is a contradiction a check can find.

      The agent half of D43's split with F-14. This row is that the read-back
      did not happen; F-14 is that the gate accepted the claim it had.

