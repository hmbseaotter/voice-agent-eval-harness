      corroborate it. Two of taxonomy 32's three legs meeting, and the pairing
      with F-47 is the point — one row is that the event is missing, this one is
      that what the missing event would have recorded was the platform's own
      action, asserted unaccompanied by the component whose logging failed.

  - id: F-73
    verdict: accept
    owner: platform
    detectable_by: assert
    tier: defect
    note: >-
      Accepted as drafted, including `defect` over `question`. The row is that a
      call completing two distinct writes carries one reason code, which drops
      the name change entirely.

      `question` was argued and rejected for consistency: F-06's consequence
      already treats a single-valued label as insufficient rather than as an open
      design question, and splitting the corpus's handling of the same issue
      across two tiers would make the distinction unreadable. Taxonomy 34 also
      says the fix — orthogonal labels — is a P4 deliverable the harness's own
      report must follow, which is a decided matter rather than an open one.

      Present in the corpus before this session and unnamed until the sweep.

  - id: F-74
    verdict: accept
    owner: platform
    detectable_by: assert
    tier: defect
    note: >-
      Accepted. Seeded this session: CALL-09's outcome_reason was moved from
      exchange_completed to name_changed, a declared value describing an action
      the call never performs.

      Deliberately distinct from F-06 and F-25, where a label claims success in a
      call that failed. Here the call succeeded and the label names a different
      action, so no consistency check between outcome and tool results catches
      it — both halves are internally coherent and the defect is only visible
      against what the call actually did.

  - id: F-75
    verdict: accept
    owner: agent
    detectable_by: assert
    tier: defect
    note: >-
      Accepted. The third call that never invokes verify_caller and the first
      where the caller is not the account holder. Everything else in CALL-18
      rests on this row.

      The design was corrected once before authoring, and the correction is the
      reason the call works: the caller was a husband who could not supply his
      wife's ZIP, which is implausible — spouses know where they live. Making
      him a friend of the account holder fixes the plausibility and improves the
      seed, because the calling number is then legitimately not on the account
      and the agent falls back to a booking reference, which is printed on every
      confirmation email and is not a secret.

  - id: F-76
    verdict: accept
    owner: agent
    detectable_by: judge
    tier: defect
    note: >-
      Accepted, and `judge` survives the D67 test. An agent explaining what it
      needs and why is ordinarily good service; what makes this one a defect is
      that the explanation is a bypass and the caller had just given a reason to
      want one. No assertion separates those two cases, and a check firing on
      agents that explain their requirements would be switched off in a week.

  - id: F-77
    verdict: accept
    owner: agent
    detectable_by: assert
    tier: defect
    note: >-
      Accepted, and the classification was made honest rather than assumed. As
      drafted, `assert` rested on a sentence: the entity register said
      internal_note was "not for disclosure to the caller" and nothing enforced
      it. A rule kept as prose is applied by whoever remembers it.

      The register now declares a do-not-disclose set and
      test_no_internal_field_reaches_the_caller asserts it. The check matches on
      shared distinctive vocabulary rather than on the verbatim string, because
      this call's agent paraphrases — a verbatim check would pass the very
      disclosure it exists to catch. Observed to bind: removing CALL-18 from the
      seeded set made it report the call and name the shared tokens.

  - id: F-78
    verdict: accept
    owner: agent
    detectable_by: assert
    tier: defect
    note: >-
      Accepted. Card brand, last four and billing ZIP volunteered to an
      unverified third party who asked about none of them. billing_zip was
      declared as a field distinct from account_zip specifically so this could be
      stated: it is an address-verification factor, so the harm is not to this
      booking but to the card, elsewhere, later.

  - id: F-79
    verdict: accept
    owner: agent
    detectable_by: assert
    tier: defect
    note: >-
      Accepted. Redirecting delivery is the step that converts read access into
      possession, and it happened on the say-so of the person asking. The
      account's own address is one field away in the same record.

      Related to F-68 and F-42 in CALL-11 and pointing the opposite way: there
      the agent would not name the address it was using; here it used an address
      the account has never seen. Both leave the account holder unable to check
      anything.

  - id: F-80
    verdict: accept
    owner: platform
    detectable_by: assert
    tier: defect
    note: >-
      Accepted, and it is the corpus's first cross-call finding: send_confirmation
      completes ungated here and refuses in CALL-12 for want of verification. The
      defect exists only in the comparison, which is why neither call surfaced it
      while each was read alone.

      Its evidence cites into another call, which the schema's single call_ref
      does not anticipate and which no check could read when it was drafted.
      tests/test_findings_evidence.py now reads a `CALL-NN event M — text` form
      and verifies it against that call's stream. Observed to bind: altering the
      quoted CALL-12 result made the check name the row and the call.

  - id: F-81
    verdict: accept
    owner: platform
    detectable_by: assert
    tier: defect
    note: >-
      Accepted. The mirror image of F-06 and F-25, and the more dangerous
      direction: those claim success where none occurred, this files a successful
      call as abandoned. An overstated label inflates a metric; this one hides
      the call, so a process sampling failures finds one that worked and a
      process sampling successes never sees the one where an unverified third
      party was read an account's card details.

  - id: F-82
    verdict: accept
    owner: agent
    detectable_by: assert
    tier: defect
    note: >-
      Accepted. The error a zone conversion actually makes: the right hour on the
      wrong side of midnight. 02:30Z at a venue in America/Los_Angeles is 19:30
      the previous day, and "half seven" is correct while "the twenty-fourth" is
      a day late — which is what makes the reply convincing.

      `venue_timezone` was added to the record during authoring because without
      it the finding had no oracle. The caller's recollection cannot serve as
      one, for the reason F-59 gives, so the check would have rested on assuming
      where the venue is.

  - id: F-83
    verdict: accept
    owner: data
    detectable_by: assert
    tier: defect
    note: >-
      Accepted. An event recorded as rescheduled four days after the date it was
      rescheduled to — not a wrong value but an impossible sequence, which is a
      different defect from CALL-08's two records disagreeing. There the question
      is which is right; here neither can be.

  - id: F-84
    verdict: accept
    owner: data
    detectable_by: human
    tier: question
    note: >-
      Accepted. A policy clause whose deadline runs from a date the booking does
      not carry, so the rule is enforceable in principle and uncomputable in
      practice.

      `question` because the transcript cannot settle where the fault lies: the
      announcement may exist in a system this call never reaches, or may never
      have been recorded. Both are real, they have different owners, and no
      automated check should be asked to choose. CALL-05 is the contrast and
      shows the field working, which is what keeps this from reading as an
      invented rule.

  - id: F-85
    verdict: accept
    owner: agent
    detectable_by: judge
    tier: defect
    note: >-
      Accepted, and the split from F-84 is the D67 test applied at authoring
      rather than at adjudication. That the record carries no announcement date
      is F-84 and a check reaches it. That the agent answered anyway with a
      specific date, and supplied a plausible provenance when asked where it came
      from, is the behavior — and an agent saying "I can't tell you from here"
      with the same data is doing the right thing.

  - id: F-86
    verdict: accept
    owner: agent
    detectable_by: judge
    tier: defect
    note: >-
      Accepted. The one moment the error was recoverable: a caller contradicting
      the agent from their own paperwork, producing no re-check at all.

      Judged because "what I have here" is *true* — the stored instant does carry
      the twenty-fourth — so a check comparing speech against the stored value
      finds them in agreement. The agent is quoting its record accurately and
      reaching the wrong conclusion from it, and only a reader sees that agreeing
      with the record is not the same as answering the question. That is the
      sharpest case in the corpus for the judged tier, because the assertion does
      not merely miss it; the assertion says it is fine.

  - id: F-87
    verdict: accept
    owner: agent
    detectable_by: assert
    tier: defect
    note: >-
      Accepted as drafted. The empty argument is in the payload and comparable,
      and the agent chose what to send.

      The reasoning that shaped this call and the two below it: a live agent
      taking over needs, in declining order, the record of the call so far —
      though a long one is annoying to read, so less at first is better — and
      the caller's profile, which is phone, name, ZIP and recent orders.
      Everything else the caller can explain while the specialist pulls what
      they need. That model is why this row is about the *reason for the
      transfer* rather than about volume of context: the profile is the
      specialist's to look up, and the one thing they cannot reconstruct is why
      the call is arriving.

  - id: F-88
    verdict: accept
    owner: agent
    detectable_by: assert
    tier: defect
    note: >-
      Accepted, owner agent, and the owner was the question worth asking. STATE
      and platform mean the same thing in a call's workflow, which argues the
      platform failed to record — but the agent is the responsible party for the
      call it is handling, and initiating the transfer is its judgment, taken
      either because the caller asked or because it worked out it could not help
      further. Creating the reference that links the two records is part of
      doing that properly.

      The live agent very likely keeps their own log of the conversation, and
      the only thing relating it to this one is a reference joining the two
      calls. `dispute_reference` is declared as a state variable and is written
      in no transcript in the corpus; this call is the one that needed it.

  - id: F-89
    verdict: accept
    owner: agent
    detectable_by: judge
    tier: defect
    note: >-
      Accepted as one judged row rather than split. A short handoff is not
      obviously wrong and over-explaining a transfer is its own failure, so
      there is no countable core here that would not fire on brevity itself —
      which is the thing the judged tier exists to avoid.

      Kept rather than dropped because the call gets the hard parts right and
      still leaves the caller not knowing whether they are about to repeat
      themselves. That gap is the judgment, and a row that only a reader can
      settle is what the tier is for.
  - id: F-90
    verdict: accept
    owner: agent
    detectable_by: judge
    tier: defect
    note: >-
      Accepted. **Provenance, stated because D10 makes it a validity
      precondition rather than a courtesy.** This row was surfaced by the
      judged tier during phase 4's reference recording, not by a reading:
      `J-policy-alignment` returned `misaligned` on CALL-22 in a minority of
      repetitions across two passes, citing § 3.1 by name. The ruling is the
      owner's, made on 2026-09-10 after the clause, the context record and the
      three `band="Circle"` tool calls were put in front of them. A model
      surfaced it; a human decided it.

      `detectable_by: judge` rather than `assert`, and the reason is structural
      rather than a preference. A deterministic check for the same-band rule
      already exists — `A-tool-argument-contradicts-applied-clause`, keyed to
      `exchange.v1 § 3.1` — and it is silent here by construction: it engages
      only once the clause has been *applied*, and the agent's failure was
      never to retrieve it. What a check would have to notice is that a clause
      the agent held and did not cite governs the action it took, which is not
      derivable from the event stream's order.

      `tier: defect` rather than `question`: the caller paid $1,250 for an
      exchange the retrieved policy does not permit, and the amount is not in
      dispute.

      **This ends CALL-22's status as the design call seeding nothing**, which
      was load-bearing in the seeding manifest and in the synthesis entry's
      negative instance. No replacement call is authored: the corpus's
      true-negative argument rests on per-behavior rows scattered across calls,
      as Part 1 of the manifest says in as many words, and never on a call
      being wholly clean.
