# The mutation that drives each control red.
#
# A row in CONTROL-REGISTER.md saying `connected` is a claim, and a claim in a
# document is exactly what this project keeps finding to have gone stale. An
# entry here turns that claim into something re-derived: `tools/verify_controls.py`
# copies the repository, applies the mutation to the copy, and requires the named
# control to FAIL there and to PASS without it. A control that cannot be driven
# both ways has been proven against nothing.
#
# `find` must match exactly one WHOLE line in `file`; the tool refuses the entry
# otherwise, because a mutation that lands in two places is not the defect it
# names, and one that lands nowhere is the fail-open this whole exercise exists
# to find. Keep the leading indentation inside the quotes -- stripping it gives a
# `find` that matches nothing, which this file has already done once.
#
# This is a LIST, not a mapping keyed by control name, because
# `test_every_traced_finding_is_on_a_call_the_entry_fires_on` exists in two
# modules under the same name and a mapping silently kept one of them. `file` is
# what separates them, and the tool runs the control as `<file>::<name>` when
# that file defines it.
#
# Not every control has an entry. The register's `unaudited` rows are the ones
# nobody has driven either way, and their absence here is the honest form of that.

controls:
  - control: test_the_control_character_sweep_would_notice_one
    file: tests/test_acceptance.py
    defect: >-
      The extension filter matches nothing, so the sweep reads no file and passes
      over a tree full of control characters. This is the mode the control claimed
      to catch and did not: it recomputed the detection expression on a literal of
      its own instead of driving the sweep.
    find: '_SWEPT: Final[frozenset[str]] = frozenset({".py", ".md", ".yaml", ".yml", ".toml", ".txt", ".cfg"})'
    replace: '_SWEPT: Final[frozenset[str]] = frozenset({".nothing-matches-this"})'

  - control: test_the_anchor_check_would_notice_a_moved_event
    file: tests/test_corpus_hygiene.py
    defect: >-
      The per-row anchor comparison can never report a problem, so a manifest that
      no longer describes the corpus passes. The control asserted properties of the
      corpus beside the check and never executed this comparison.
    find: '    return problems'
    replace: '    return []'

  - control: test_the_leak_scan_would_notice_a_turn_that_was_in_the_corpus
    file: tests/test_context_seam.py
    defect: >-
      The leak comparison can never report a leak, so agent speech present in the
      grounding corpus reads as absence. The control was a tautology -- it built
      `corpus + turn` and asserted the turn was in it, true for every corpus.
    find: '    return leaked'
    replace: '    return []'

  - control: test_the_register_guard_would_notice_an_unregistered_control
    file: tests/test_document_counts.py
    defect: >-
      The register is read as naming no controls at all, so the guard compares the
      idiom against an empty set. A register parsed to nothing would otherwise make
      every row look present.
    find: '    return _test_names_in(CONTROL_REGISTER.read_text(encoding="utf-8")) - modules'
    replace: '    return set()'

  - control: test_the_mutation_spec_would_notice_an_anchor_that_moved
    file: tests/test_document_counts.py
    defect: >-
      No mutation anchor can ever be reported stale, so a `find` that a formatter
      has moved passes unnoticed and the replay gate quietly stops verifying. The
      first version of this control re-counted a list it had built itself and
      passed with this defect in place -- the register's own guard carrying the
      shape the register exists to find.
    find: '        hits = lines.count(body["find"].rstrip())'
    replace: '        hits = 1'

  - control: test_every_traced_finding_is_on_a_call_the_entry_fires_on
    file: tests/test_conduct_checks.py
    defect: >-
      EXPECTED_FIRING is read as empty, so the loop never runs and the assertion
      passes having compared nothing. Not a control but a consistency assertion,
      and it had no floor at all: it passed over an empty table until this audit
      gave it one, while its neighbors in the same file carried floors.
    find: '    for entry_id, (expected, findings) in EXPECTED_FIRING.items():'
    replace: '    for entry_id, (expected, findings) in {}.items():'

  - control: test_every_traced_finding_is_on_a_call_the_entry_fires_on
    file: tests/test_record_checks.py
    defect: >-
      The same missing floor, in the second of the two modules carrying this test
      name. A mapping keyed on the control name kept only one of these two entries,
      which is why this file is a list.
    find: '    for entry_id, (expected, findings) in EXPECTED_FIRING.items():'
    replace: '    for entry_id, (expected, findings) in {}.items():'

  - control: test_every_traced_finding_is_assert_detectable_and_on_a_call_the_entry_fires_on
    file: tests/test_omission_checks.py
    defect: >-
      EXPECTED_FIRING is read as empty, so neither the assert-detectable claim nor
      the firing claim is compared against anything, and the assertion passes.
    find: '    for entry_id, (expected, findings) in EXPECTED_FIRING.items():'
    replace: '    for entry_id, (expected, findings) in {}.items():'

  - control: test_the_spy_would_notice_a_connection
    file: tests/test_cli.py
    defect: >-
      The spy patches every route to a socket but records nothing, so the assertion
      that the list stayed empty is satisfied by a spy that never fills it. The
      check passes over this; the control is the only thing that fires.
    find: '            opened.append(name)'
    replace: '            pass'

  - control: test_the_event_scoped_check_fires_on_a_door_time_its_titles_agree_with
    file: tests/test_corpus_hygiene.py
    defect: >-
      The event-scoped comparison reports no disagreement whatever the corpus says.
      The check passes over it; again the control is the only thing that fires.
    find: '    return problems, compared'
    replace: '    return [], compared'

  - control: test_the_measurement_scan_fires_on_an_undated_unbound_number
    file: tests/test_corpus_hygiene.py
    defect: >-
      The marker matches nothing, so the scan reads no stated measurement anywhere
      and reports a clean tree.
    find: '    r"Measured(?:\s+[\w\s]{0,40}?)?:"'
    replace: '    r"ThisMarkerMatchesNothingAtAll:"'

  - control: test_the_matched_by_check_fires_when_the_register_names_the_wrong_call
    file: tests/test_corpus_hygiene.py
    defect: >-
      The comparison is weakened from equality to a superset test, which is what
      lets the register name an extra call. Before the repair, the check and the
      control both stayed green on this.
    find: '    if named == exceptional:'
    replace: '    if named >= exceptional:'

  - control: test_the_escalation_convention_check_fires_on_the_field_that_was_got_wrong
    file: tests/test_corpus_hygiene.py
    defect: >-
      The convention comparison can never report a violation, so a corpus that
      stopped carrying the escalation convention passes. Before the repair, the
      check and the control both stayed green on this.
    find: '    return {call_id: fields for call_id, fields in escalated.items() if fields != ESCALATION_RECORD}'
    replace: '    return {}'

  - control: test_the_policy_tool_binding_would_notice_a_rename
    file: tests/test_corpus_hygiene.py
    defect: >-
      The register is read as declaring no names at all, so every hardcoded
      policy-tool constant is compared against an empty set. That is the rename this
      check exists for.
    find: '    return set(re.findall(r"`([a-z_][a-z0-9_.]*)`", section))'
    replace: '    return set()'

  - control: test_the_enumeration_check_fires_on_the_call_that_actually_went_missing
    file: tests/test_document_counts.py
    defect: >-
      The enumeration stops reading call ids out of the sentence, so a call that
      went missing from it cannot be noticed.
    find: '    return ids | set(re.findall(r"CALL-\d{2}", sentence))'
    replace: '    return ids'

  - control: test_the_recall_net_fires_on_a_count_nobody_declared
    file: tests/test_document_counts.py
    defect: >-
      The net recognizes none of its nouns, so a worded count in live prose matches
      nothing and the net reports a clean tree. Every failure this net was written
      after had that shape: a strict checker ran, matched nothing, and reported
      success.
    find: '    + "|".join(_NET_NOUNS)'
    replace: '    + "|".join(["zzzz_no_such_noun"])'

  - control: test_the_tag_check_fires_on_a_number_that_disagrees_with_its_tag
    file: tests/test_document_counts.py
    defect: >-
      The tag extraction records no sites, so no tagged quantity is compared against
      the number written in front of it.
    find: '        sites.append((relative, match.group(1), numbers[-1].lower()))'
    replace: '        pass'

  - control: test_the_retired_term_check_fires_on_a_term_the_spec_retired
    file: tests/test_document_counts.py
    defect: >-
      The retired-term marker matches nothing, so no term the specification says it
      retired is looked for anywhere.
    find: '_RETIRED_TERM: Final[re.Pattern[str]] = re.compile(r''Retargeted from "([^"]+)"'')'
    replace: '_RETIRED_TERM: Final[re.Pattern[str]] = re.compile(r"MatchesNothingAtAll")'

  - control: test_the_name_check_fires_on_an_invented_test_and_rejoins_a_wrapped_one
    file: tests/test_document_counts.py
    defect: >-
      The name extraction finds no test names in any prose, so every document naming
      a mechanism that does not exist passes unremarked.
    find: '    return set(re.findall(r"\b(test_[a-z0-9_]+)\b", re.sub(r"_\r?\n\s*", "_", text)))'
    replace: '    return set()'

  - control: test_the_check_would_catch_a_slowed_transcript
    file: tests/test_speech_plausibility.py
    defect: >-
      The rate measurement returns None for every utterance, so the plausibility
      band is compared against an empty list of rates and the corpus reads as clean.
      This control's own docstring records it being repaired from that shape once
      already.
    find: '    return words / seconds * 60.0'
    replace: '    return None'

  - control: test_a_state_written_before_the_handoff_does_not_satisfy_required_state_after
    file: src/harness/checks/omission.py
    control_file: tests/test_omission_checks.py
    defect: >-
      The ordering is dropped: a state written BEFORE the handoff now satisfies a
      requirement about the state AFTER it. `after` is the parameter's own word, and
      this comparison is what makes it mean anything -- D117's shape exactly.
    find: '                    if index > invocation.call.index'
    replace: '                    if True'

  - control: test_a_variable_set_between_the_asks_clears_it_even_if_set_again_after
    file: src/harness/checks/records.py
    control_file: tests/test_record_checks.py
    defect: >-
      Last write wins: only the most recent write to the variable is considered, so a
      write made BETWEEN the two asks is forgotten the moment a later one exists.
      D117 records that shape costing a false violation on an absolute gate.
    find: '                for index in recorded.get(str(variable), ())'
    replace: '                for index in recorded.get(str(variable), ())[-1:]'

  - control: test_a_deduplication_key_would_clear_the_retry
    file: src/harness/checks/records.py
    control_file: tests/test_record_checks.py
    defect: >-
      The declared deduplication arguments are read as an empty list, so no argument
      can ever mark a re-issue as deduplicated and the parameter is not consulted at
      all.
    find: '    dedup = [str(name) for name in params["deduplication_arguments"]]'
    replace: '    dedup = []'

  - control: test_w10_a_state_cleared_before_the_action_is_not_a_violation
    file: src/harness/checks/claims.py
    control_file: tests/test_claim_checks.py
    defect: >-
      The blocking VALUE is no longer compared: any write to the gating variable
      blocks the tool, whatever it was set to. The control clears the gate to `true`
      before the action and requires the violation to go, so a check that ignores the
      value keeps reporting one.
    find: '            if _fold(value, fold_case) == blocking_value:'
    replace: '            if True:'

  - control: test_a_hedge_in_the_stating_turn_does_not_resolve_the_deadline
    file: src/harness/checks/matching.py
    control_file: tests/test_conduct_checks.py
    defect: >-
      The declared-name boundary is dropped and signals match as bare substrings,
      which is D115's defect: `may` inside `maybe`, and the resolution signals for
      the deadline entry are the twelve month names. A hedge then reads as a
      resolved deadline.
    find: '        if re.search(rf"{_BOUNDARY}{re.escape(needle)}(?![\w''])", haystack):'
    replace: '        if needle in haystack:'

  - control: test_a_word_list_would_have_fired_on_three_turns_a_phrase_list_does_not
    file: rubric.yaml
    control_file: tests/test_claim_checks.py
    defect: >-
      A phrase in the completion-claim signal list is replaced by a bare word, which
      is the word list the entry deliberately does not use. `moved` then fires on
      CALL-19, where the promoter moved the event and the agent moved nothing.
    find: '            - "i''ve moved you"'
    replace: '            - "moved"'

  - control: test_mutating_a_declared_parameter_moves_a_verdict
    file: src/harness/checks/claims.py
    control_file: tests/test_claim_checks.py
    defect: >-
      The declared success statuses stop being compared, so any tool result counts as
      a success. `success_statuses` is then a parameter the check does not read,
      whatever the YAML beside it says -- which is the criterion this control exists
      to assert per parameter rather than once.
    find: '                and invocation.result.status.value in success_statuses'
    replace: '                and True'

  - control: test_adding_the_supporting_sentence_to_speech_alone_does_not_move_the_verdict
    file: src/harness/checks/policy.py
    control_file: tests/test_policy_checks.py
    defect: >-
      A clause counts as applied when its text appears in an agent turn -- the
      grounding blob that concatenates speech alongside the three ground-truth
      sources. The claim is then resolved against the claim that made it, which is
      the seam this control guards and the half D104's criterion cannot see.
    find: "        (event.document, event.clause) for event in context.events if isinstance(event, PolicyEvent)"
    replace: "        (event.document, event.clause) for event in context.events if isinstance(event, PolicyEvent)\n    } | {\n        (document.name, clause_id)\n        for document in context.retrieved_policies\n        for clause_id, clause_text in document.clauses\n        if any(clause_text in turn.text for turn in context.subject.agent_turns)"

  - control: test_the_gate_refuses_to_write_bytecode_and_to_copy_a_stale_cache
    file: tools/verify_controls.py
    control_file: tests/test_verify_controls.py
    defect: >-
      The gate writes bytecode again, so the cache its own unmutated run leaves
      behind can be read instead of the mutated source. That masks exactly the
      mutations that preserve the file size, and it reported two connected controls
      as measuring nothing.
    find: "    environment[\"PYTHONDONTWRITEBYTECODE\"] = \"1\""
    replace: "    pass"

  # ------------------------------------------------------------------------
  # Phase 3: the model transport seam and the judged tier.
  #
  # Every mutation below is in `src/`, so each entry carries a `control_file`.
  # Three of them restore a defect that was real in this phase rather than a
  # hypothetical one -- the partial-results loss, the unpriced-model estimate
  # of zero, and the module-scope SDK import that D122 exists to prevent.
  # ------------------------------------------------------------------------

  - control: test_the_repetitions_obtained_before_an_abort_are_not_discarded
    file: src/harness/judge/engine.py
    control_file: tests/test_judge_engine.py
    defect: >-
      A transport failure part-way through a call's repetitions discards the
      repetitions already completed, so the run reports fewer results than its
      own run log holds -- `RecordingTransport` has already written them. This
      was the shipped behavior until a CLI replay test reported `results: 0`
      over a log holding one entry.
    find: '            raise JudgedCallAborted(exc, outcomes) from exc'
    replace: '            raise JudgedCallAborted(exc, []) from exc'

  - control: test_mutating_each_judged_field_changes_what_is_sent
    file: src/harness/judge/engine.py
    control_file: tests/test_judge_engine.py
    defect: >-
      The generation configuration is written at the call site instead of read
      from the rubric entry, so `model`, `max_tokens` and `effort` become
      values in the YAML that describe nothing. W20 in the judged tier, which
      is the tier with no `ParamView` to catch it.
    find: '        config=GenerationConfig(model=spec.model, max_tokens=spec.max_tokens, effort=spec.effort),'
    replace: '        config=GenerationConfig(model="claude-sonnet-5", max_tokens=2048, effort="high"),'

  - control: test_an_unpriced_model_refuses_rather_than_estimating_zero
    file: src/harness/core/transport.py
    control_file: tests/test_transport.py
    defect: >-
      A model with no published rate is costed at zero rather than refused, so
      a live run of any size prints `$0.00` at the one moment a human is being
      asked to agree to the spend. This was the first draft, as
      `PRICING_USD_PER_MTOK.get(model, (0.0, 0.0))`.
    find: '    raise UnpricedModelError(model)'
    replace: '    return (0.0, 0.0)'

  - control: test_the_replay_path_does_not_import_the_sdk
    file: src/harness/core/transport.py
    control_file: tests/test_transport.py
    defect: >-
      The SDK import moves from `LiveTransport.__init__` to module scope, so
      every replay run -- and the deterministic tier, which imports the CLI --
      loads it. D122's condition is that the tier runs key-free, and this is
      the one-line change that would quietly end it.
    find: 'if TYPE_CHECKING:  # pragma: no cover - imported for annotations only'
    replace: 'if True:  # the deferred import becomes a real one'

  - control: test_the_run_log_carries_no_credential_that_was_in_the_prompt
    file: src/harness/core/transport.py
    control_file: tests/test_transport.py
    defect: >-
      The scrubber matches nothing, so a credential that reached a prompt
      reaches the run log verbatim. The requirement is that credential values
      are excluded from every log, report and error message, and this is what
      its absence looks like.
    find: '        if len(value) >= MINIMUM_CREDENTIAL_LENGTH:'
    replace: '        if len(value) >= 1_000_000_000:'

  - control: test_the_ceiling_is_a_number_of_calls_issued_and_not_that_number_plus_one
    file: src/harness/core/transport.py
    control_file: tests/test_transport.py
    defect: >-
      The ceiling admits one call past its limit. An off-by-one here is the
      difference between a budget and a budget plus one call, on a run whose
      calls each carry a whole transcript.
    find: '        if self._issued >= self._ceiling:'
    replace: '        if self._issued > self._ceiling:'

  - control: test_a_refused_call_is_not_recorded_because_it_did_not_happen
    file: src/harness/core/transport.py
    control_file: tests/test_transport.py
    defect: >-
      The same off-by-one, driving the other property it breaks: the call the
      ceiling should have refused is issued and therefore recorded, so the run
      log carries an entry for a call the ceiling reported refusing. Two
      controls for one defect, and the register says so rather than letting the
      second look independently proven.
    find: '        if self._issued >= self._ceiling:'
    replace: '        if self._issued > self._ceiling:'

  - control: test_each_population_is_validated_against_its_own_set_and_not_the_union
    file: src/harness/judge/citations.py
    control_file: tests/test_judge_prompt.py
    defect: >-
      A fact citation is validated against every rendered identifier's number
      rather than against the fact population, so `[F9]` on a call with twelve
      transcript lines and two facts is accepted because `T9` exists. That is
      W1's shape exactly: a validator checking against a universe wider than
      the one the prompt rendered.
    find: '            valid = identifier in universe.facts'
    replace: '            valid = any(o[1:] == identifier[1:] for o in universe.all_identifiers)'

  # ------------------------------------------------------------------------
  # Three mechanisms that replaced non-systematic verification, 2026-09-09.
  # Each closed a caveat in `tools/verify_phase3.py` that said a property was
  # stated in prose, or asserted by an enumeration rather than by a rule.
  # ------------------------------------------------------------------------

  - control: test_the_sdk_retry_count_is_zero_so_our_backoff_replaces_it
    file: src/harness/core/transport.py
    control_file: tests/test_transport.py
    defect: >-
      The SDK's own retries are left at their default, so this project's backoff
      WRAPS them instead of replacing them. Two mechanisms layered multiply the
      wall-clock cost of every failure across a run of a thousand calls and make
      `transport_attempts` in the run log describe one of the two. The
      specification requires the posture to be stated; it was stated in prose
      and read by nothing until this control.
    find: 'SDK_RETRIES: Final[int] = 0'
    replace: 'SDK_RETRIES: Final[int] = 2'

  - control: test_the_retry_loop_sleeps_the_declared_schedule_and_not_after_the_last_try
    file: src/harness/core/transport.py
    control_file: tests/test_transport.py
    defect: >-
      The loop sleeps after its final attempt as well, spending the full backoff
      delay to reach the giving-up it had already decided on. The schedule was
      previously unasserted on the grounds that checking it would mean a test
      that waits -- which was wrong: the sleeps are a sequence of requested
      delays, and a recorder captures them in no time at all.
    find: '                if attempt < MAX_TRANSPORT_ATTEMPTS:'
    replace: '                if attempt <= MAX_TRANSPORT_ATTEMPTS:'

  - control: test_every_judged_field_has_a_declared_mutation
    file: src/harness/core/rubric.py
    control_file: tests/test_judge_engine.py
    defect: >-
      A `JudgeSpec` field is renamed and the test that exercises it is not,
      which is the shape the coverage guard exists for: the mutation test
      covered all eight fields by a hand-written list, so a ninth field -- or a
      renamed one -- would have failed nothing. `ParamView` buys this for the
      deterministic tier on every run; a judged entry has no `params`, so the
      rule is read off `dataclasses.fields` instead.
    find: '    effort: str'
    replace: '    effort_level: str'

  - control: test_the_register_guard_would_notice_an_unregistered_obligation
    file: tests/test_obligations.py
    defect: >-
      The harvest reads no handover at all, so the obligations register compares
      its rows against an empty population -- every row looks orphaned and every
      owed item looks registered. That is the fail-open this register exists to
      remove, arriving in the register's own guard: a rule that harvests nothing
      is a list again, and a list nobody maintains is the reading it replaced.
    find: '    for path in sorted(SESSIONS.glob("HANDOVER-*.md")):'
    replace: '    for path in sorted(SESSIONS.glob("NO-SUCH-HANDOVER-*.md")):'

  - control: test_a_live_transport_with_no_credential_in_reach_refuses
    file: src/harness/core/transport.py
    control_file: tests/test_transport.py
    defect: >-
      The lookup returns an empty credential instead of refusing, so the harness
      no longer requires one: `anthropic.Anthropic(api_key="")` constructs, the
      operator confirms the spend, and the 401 arrives from the provider one
      call later. The requirement names the harness. Nothing in the suite drove
      this refusal -- the only test naming `CredentialMissingError` constructed
      the exception and read its message -- so removing it left all 159
      judged-tier tests green while verifier criterion 18 ticked.
    find: '    raise CredentialMissingError()'
    replace: '    return CREDENTIAL_VARIABLES[0], ""'

  - control: test_the_credential_lookup_reads_both_routes_and_refuses_only_when_both_are_empty
    file: src/harness/core/transport.py
    control_file: tests/test_transport.py
    defect: >-
      Same defect, seen at the named function rather than through the
      transport. Two entries because the requirement has two callers now: the
      CLI asks before it prints an estimate and the transport asks before it
      builds a client, and a refusal that only one of them could reach is the
      arrangement this replaced.
    find: '    raise CredentialMissingError()'
    replace: '    return CREDENTIAL_VARIABLES[0], ""'

  - control: test_live_mode_requires_a_credential_before_it_prints_an_estimate
    file: src/harness/cli.py
    control_file: tests/test_cli.py
    defect: >-
      The credential is not checked until the transport is constructed, which
      the CLI reaches only after printing the estimate and taking the
      confirmation. The run still exits 2, so the mutation is invisible to an
      exit-code assertion -- what fails is the ORDER: an operator with no key
      is asked to approve spend they cannot make. The requirement states the
      three clauses in the order they have to happen in.
    find: '            resolve_credential(root)'
    replace: '            pass  # resolve_credential(root)'

  - control: test_no_scrubbed_field_of_a_run_log_entry_carries_a_credential
    file: src/harness/core/transport.py
    control_file: tests/test_transport.py
    defect: >-
      The model's own response text is written to the run log unscrubbed. Three
      of the four scrubbed fields could be removed one at a time with the whole
      judged-tier suite staying green: the only test planted its key in the
      PROMPT, and the committed-artifact scan is the right instrument for the
      artifact and says nothing about a writer that would leak into a new log.
      `response_text` is the likeliest of the four to carry a stray secret,
      because it is the model's text rather than this project's.
    find: '            "response_text": scrub_credentials(self.response.text, credentials),'
    replace: '            "response_text": self.response.text,'

  - control: test_both_credential_values_are_scrubbed_when_the_two_disagree
