# Per-instance severity: the declared half (D206).
#
# The ranked severity in corpus/findings.severity.json is a human's ordering of
# the gold set's findings, and it exists only for calls somebody labeled. This
# file is the counterpart for every other call: what it takes to compute a band
# in code for one rubric entry counting against its gate on one call, from
# boolean properties, with no model and no scale handed to anyone.
#
# Two layers, and only the first is here. **What kind of harm a violation of an
# entry means** is a property of the entry, declared below. **What happened in
# the call** is a property of the instance, read from the event stream by
# src/harness/instance_severity.py, which documents the four it reads.
#
# Beside the rubric and never in it: rubric.yaml is frozen at rubric-frozen-v1
# and pinned there by test, and these declarations are not what the held-out
# labels were scored against.
#
# The three properties, each true when a violation of the entry:
#
#   touches_account_access        concerns who may see or change an account or its
#                                 protected data: identity, verification, a
#                                 disclosure, a write gated on either, a write
#                                 sent somewhere the account does not know
#   touches_money_or_entitlement  concerns money moved or owed, or a booking
#                                 right: a refund, an exchange, a transfer, an
#                                 amount, a rule deciding any of them
#   leaves_caller_misinformed     leaves the caller told something false, or
#                                 without something they asked for
#
# An entry with all three false is a defect in the record or in the conduct of
# the call that harms nobody on it directly. That is a statement about the
# instance's harm and not about the entry's gate: an absolute gate says a run
# must not pass with this defect in it, and a band says what the defect cost.
#
# `reads` names where each instance property finds the lists it needs, in the
# frozen rubric's own params, so no tool name or state name is typed twice.

version: "1"

reads:
  consequential_write_tools: {entry: A-gated-write-without-verification, param: gated_tools}
  success_statuses: {entry: A-gated-write-without-verification, param: success_statuses}
  verification_states: {entry: A-gated-write-without-verification, param: verification_states}
  irreversible_tools: {entry: A-irreversible-action-without-confirmation, param: actions, field: tool}
  handoff_tools: {entry: A-handoff-without-context, param: handoffs, field: tool}

excluded:
  J-call-synthesis: >-
    The synthesis restates what the other entries found on the call, so a band
    for it would count their harm a second time. Its rubric description says the
    same from the other side: it is deliberately not a severity score.

